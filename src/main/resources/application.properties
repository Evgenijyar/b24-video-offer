spring.application.name=b24-video-offer

# HTTP server
server.port=8080
server.forward-headers-strategy=framework

# PostgreSQL: separate database on the same PostgreSQL server used by OKK
spring.datasource.url=jdbc:postgresql://45.11.92.142:5433/b24_video_offer
spring.datasource.username=b24_video_offer_user
spring.datasource.password=Secret123IUGBhbjn87##gfreg224
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=3000

# JPA / Flyway
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# Public video-offer links
app.public-base-url=https://offer.abs7.ru
app.video.storage-dir=./data/videos
app.video.retention-days=7

# Kontur.Talk
app.talk.api-url=https://rko7.ktalk.ru
app.talk.api-token=2pGpx4TSnGF9IUWVYXaInNVUht7Qnaxz

# HTTP proxy used ONLY for all Kontur.Talk requests, including Range probes and video parts.
# Set enabled=true and fill host/port. Username/password may both be left empty for a proxy without auth.
app.talk.proxy.enabled=true
app.talk.proxy.host=216.57.105.22
app.talk.proxy.port=31289
app.talk.proxy.username=elvin_proxy
app.talk.proxy.password=hSkUlLcl8gvIIAT0iSayaigg

# Bitrix24 local application
app.bitrix.client-id=local.6a7130a66d2604.85664387
app.bitrix.client-secret=PmSciYHoPh6Od0DA95c023MjHNh0HfDL38TFdDaZ85xrXxh98t
app.bitrix.redirect-uri=https://offer.abs7.ru/bitrix/install
app.bitrix.backoffice-connect-timeout-seconds=10
app.bitrix.backoffice-read-timeout-seconds=20

logging.level.ru.abs7.videooffer=INFO

# Background processing / concurrency
# Keep Spring Boot's standard applicationTaskExecutor for MVC/JPA framework integrations.
# Video Offer workloads below use explicitly named pools and do not compete with it.
spring.task.execution.mode=force
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=4
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=application-task-

# Heavy video work is tenant-fair: one company cannot occupy the whole server.
app.concurrency.video.global-workers=3
app.concurrency.video.per-tenant-workers=2
app.concurrency.video.queue-capacity=500
# Fast Bitrix notifications never wait behind FFmpeg/download jobs.
app.concurrency.notification.core-workers=2
app.concurrency.notification.max-workers=4
app.concurrency.notification.queue-capacity=500
# Installation self-healing and ready-link delivery use a separate light executor.
app.concurrency.system.core-workers=2
app.concurrency.system.max-workers=4
app.concurrency.system.queue-capacity=200
app.video.cleanup-cron=0 15 * * * *

# Detailed Kontur.Talk diagnostics and network protection
app.talk.connect-timeout-seconds=15
app.talk.read-timeout-seconds=120
app.talk.stall-warning-seconds=30
app.talk.progress-log-step-percent=5
app.talk.progress-log-interval-seconds=20

# Detailed application logs: console + persistent file in Docker volume
logging.file.name=./data/logs/b24-video-offer.log
logging.logback.rollingpolicy.max-file-size=20MB
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.total-size-cap=200MB
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [requestId=%X{requestId:-}] %logger{48} - %msg%n%wEx
logging.pattern.file=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [requestId=%X{requestId:-}] %logger{48} - %msg%n%wEx

# Video Offer master back-office
app.backoffice.username=admin
app.backoffice.password=ea7zS3_1BM91pWRsCMAEwegd
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict

# Update 039: per-company public offer page builder
app.page-builder.storage-dir=./data/page-builder
