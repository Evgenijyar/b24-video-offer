<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Видео-оффер — установка</title>
    <script src="https://api.bitrix24.com/api/v1/"></script>
    <style>
        html, body { margin: 0; padding: 0; background: transparent; font-family: Arial, sans-serif; }
        .wrap { min-height: 180px; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; }
        .card { width: 100%; max-width: 560px; border-radius: 16px; padding: 22px; box-sizing: border-box; background: #fff; color: #1f2937; box-shadow: 0 8px 30px rgba(0,0,0,.08); }
        h1 { font-size: 20px; margin: 0 0 8px; }
        p { margin: 0; line-height: 1.45; color: #667085; }
        .error { color: #b42318; margin-top: 12px; display: none; white-space: pre-wrap; }
        @media (prefers-color-scheme: dark) {
            .card { background: #17191c; color: #f5f5f5; }
            p { color: #a8adb7; }
        }
    </style>
</head>
<body>
<div class="wrap">
    <div class="card">
        <h1>Видео-оффер</h1>
        <p id="status">Завершаем установку приложения…</p>
        <div id="error" class="error"></div>
    </div>
</div>
<script>
(function () {
    const status = document.getElementById('status');
    const errorBox = document.getElementById('error');

    function fail(message) {
        status.textContent = 'Не удалось завершить установку.';
        errorBox.textContent = message || 'BX24.installFinish недоступен';
        errorBox.style.display = 'block';
    }

    function finishInstallation() {
        if (!window.BX24 || typeof BX24.init !== 'function') {
            fail('JS SDK Bitrix24 не загрузился. Закройте приложение и откройте его повторно.');
            return;
        }

        try {
            BX24.init(function () {
                try {
                    status.textContent = 'Установка завершена. Открываем приложение…';
                    BX24.installFinish();
                } catch (error) {
                    fail(error && error.message ? error.message : String(error));
                }
            });
        } catch (error) {
            fail(error && error.message ? error.message : String(error));
        }
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', finishInstallation, { once: true });
    } else {
        finishInstallation();
    }
})();
</script>
</body>
</html>
